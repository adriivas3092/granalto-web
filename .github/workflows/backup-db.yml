name: Respaldo base de datos (Supabase)

# Respaldo automático de la base de datos.
# - Corre todos los días a las 08:00 UTC (~02:00 Costa Rica).
# - También se puede ejecutar a mano desde la pestaña Actions ("Run workflow").
# Requiere el secreto SUPABASE_DB_URL (cadena de conexión de Supabase).
# Los respaldos quedan como "artifacts" del workflow (descargables, 90 días).

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar respaldo
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL. Agregalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          TS=$(date -u +%Y%m%d-%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --no-owner --no-privileges --format=custom \
            --file="granalto-db-$TS.dump"
          ls -lh granalto-db-*.dump

      - name: Subir respaldo (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: granalto-db-backup
          path: granalto-db-*.dump
          retention-days: 90
          if-no-files-found: error
